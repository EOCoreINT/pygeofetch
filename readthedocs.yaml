# Read the Docs configuration file for pygeofetch
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Build documentation with Sphinx
sphinx:
  configuration: docs/conf.py
  # Fail the build on any warning (recommended once docs are stable;
  # comment this out while you're still setting docs up)
  # fail_on_warning: true

# Install pygeofetch itself (so autodoc can import it) plus the
# docs-only dependencies
python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

# Build formats made available for download in addition to HTML
formats:
  - pdf
  - epub
