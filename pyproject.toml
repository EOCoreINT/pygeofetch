[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeofetch"
version = "2.6.2"
description = "Universal satellite data pipeline + geospatial processing platform"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Samuel Appiah Kubi", email = "appiahkubis14@gmail.com" },
]
keywords = ["satellite", "remote-sensing", "GIS", "earth-observation", "geospatial", "SAR", "Sentinel", "Landsat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.9"
dependencies = [
    # Tier 1: Core (always installed)
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "keyring>=24.3",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "requests>=2.31",
    "anyio>=4.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    # pygeofetch/models/*.py uses PEP 604 unions (`str | None`), native
    # only from Python 3.10. On 3.9, pydantic v2 needs this backport to
    # evaluate those annotations at runtime — without it, importing any
    # model (SatelliteAsset, etc.) raises TypeError at class-definition
    # time. Only actually needed below 3.10; harmless no-op above it.
    "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
# Tier 2: Geospatial core
geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyarrow>=15.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

# Tier 3: Data loading & processing
processor = [
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "eoreader>=0.24",
    "spyndex>=0.5",
    "scipy>=1.12",
    "scikit-image>=0.23",
    "geopandas>=0.14",
]

# Tier 4: Additional providers
providers = [
    "eodag>=3.0",
]

# Tier 5: lightweight SAR backend (pygeofetch.sar) — matches the
# "pip install pygeofetch[sar]" instruction in pygeofetch/sar/__init__.py.
# Not required by pygeofetch.insar (nothing there imports sarxarray), and
# not exercised by any test, so it's kept separate rather than bundled
# into insar below. sarxarray currently has no released version
# supporting Python 3.9, which broke CI on that interpreter when this was
# still folded into insar/test.
sar = [
    "sarxarray>=0.1",
]

# Tier 5b: interferometric SAR processing (pygeofetch.insar)
insar = [
    "scipy>=1.12",
    # Required by pygeofetch.insar.preflight for AOI-vs-footprint coverage
    # checks; pygeofetch.insar's __init__ imports preflight eagerly, so this
    # must be declared here or `pip install "pygeofetch[insar]"` (as the
    # module's own docstring instructs) leaves the package unimportable.
    "shapely>=2.0",
    # Required by pygeofetch.insar.analysis (hard top-level `import xarray`,
    # used for risk-mapping output). This used to be satisfied for free as
    # a transitive dependency of sarxarray when sarxarray was still bundled
    # into this extra — now that sarxarray lives in the separate `sar`
    # extra above, it has to be declared here directly.
    "xarray>=2024.1",
]

# Tier 5c: SAR processing (heavy — requires SNAP)
ost = [
    # REAL BUG FIXED: this was pinned ">=3.0", a version that has never
    # existed — opensartoolkit's real releases on PyPI top out at
    # 0.12.15 and use 0.x versioning throughout (there is no 3.x line).
    # `pip install` fails outright trying to resolve this. 0.12.1 is the
    # earliest 0.12.x release actually published.
    "opensartoolkit>=0.12.1",
]

# Tier 6: Visualization
viz = [
    "leafmap>=0.30",
    "folium>=0.16",
    "matplotlib>=3.7",
    "localtileserver>=1.0.0",
    "ipysheet>=0.6.0",
    "ipyleaflet>=0.17.0",
    "ipywidgets>=8.0.0",
    "ipyevents>=2.0.2",
    "ipyfilechooser>=0.6.0",
    # REAL BUG FIXED: pinned ">=0.6.0", a version that does not exist —
    # sidecar's real releases jump 0.5.2 -> 0.7.0 with no 0.6.x ever
    # published. `pip install` fails outright trying to resolve this.
    "sidecar>=0.5.0",
    "bokeh>=3.0.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    # REAL BUG FIXED: pinned ">=2.4.0", a version that has never
    # existed — whitebox's real releases top out at 2.3.6. This is the
    # exact failure from the reported `pip install` error. 2.3.0 is a
    # safely-real, reasonably recent floor.
    "whitebox>=2.3.0",
    # REAL BUG FIXED: same issue — pinned ">=2.4.0" but whiteboxgui's
    # real releases top out at 2.3.0.
    "whiteboxgui>=2.2.0",
    "geemap>=0.28.0",
    "osmnx>=1.9.4",
    # REAL BUG FIXED: pinned ">=1.9.4", a version that has never
    # existed — contextily's real releases top out at 1.7.1. `pip
    # install` fails outright trying to resolve this.
    "contextily>=1.6.0",
    "xyzservices>=2023.10.0",
    "mapclassify>=2.6.0",
    "geoplot>=0.5.0",
    "mplleaflet>=0.0.5",
    "branca>=0.6.0",
    "plotly-geo>=1.0.0",
    "streamlit>=1.28.0",
    "pyvista",
]

# Tier 6b: Kepler.gl 3D map visualization — isolated from the main viz extra.
# keplergl's latest stable release (0.3.7) ships no wheel and pulls in a
# hardcoded pyarrow~=16.0.0 build dependency inside its own setup.py, a
# pyarrow version with no Windows wheel for Python 3.13. Building it from
# source fails there with "ModuleNotFoundError: No module named
# 'pkg_resources'" (pyarrow 16.0.0's legacy setup.py-based build is
# incompatible with pip's modern isolated build environment). This is a
# real, confirmed, reproducible failure in keplergl's own packaging, not
# something fixable by re-pinning keplergl from pygeofetch's side — the
# only newer release is 0.4.0rc1, a pre-release, not appropriate as a
# default dependency for a Production/Stable-classified package.
# Kept fully optional and explicitly opt-in so `pip install pygeofetch[viz]`
# and `pygeofetch[full]`/`pygeofetch[all]` install cleanly everywhere;
# install `pygeofetch[viz-3d]` specifically if you need kepler.gl maps and
# your platform can build it (Linux/macOS, or Windows with a pinned working
# pyarrow already installed).
viz-3d = [
    "keplergl>=0.3.0",
]

# Cloud providers
cloud = [
    "boto3>=1.34",
    "pystac>=1.9",
    "planetary-computer>=1.0",
]

# Notebook support
notebook = [
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "jupyter>=1.0",
]

# Scheduling
schedule = [
    "croniter>=2.0",
]

# Development
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "black>=24.0,<25.0",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

# Everything required to actually run `pytest tests/` and collect every
# module without ImportErrors. Several test files import rasterio and
# scipy directly (real GeoTIFF I/O / independent reference-implementation
# checks in the InSAR integration tests), on top of what the insar/geo
# extras' own library code needs. CI should install this extra, e.g.
# `pip install -e ".[test]"`.
test = [
    "pygeofetch[dev,geo,insar]",
]

insar-full = [
    "snaphu>=0.1",
    "scipy>=1.12",
]

# Everything that reliably installs across platforms — keplergl (see
# viz-3d above) and sarxarray (see sar above, no Python 3.9 release) are
# deliberately excluded; add them explicitly if you need them.
full = [
    "pygeofetch[geo,processor,providers,insar,viz,cloud,notebook,schedule]",
]
# Legacy alias
all = ["pygeofetch[full]"]

[project.scripts]
pygeofetch = "pygeofetch.cli.main:cli"

[project.urls]
Homepage      = "https://www.eocoreint.com/"
Documentation = "https://appiahkubis14.github.io/pygeofetch-docs/"
Repository    = "https://github.com/EOCoreINT/pygeofetch"
"Bug Tracker" = "https://github.com/EOCoreINT/pygeofetch/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pygeofetch*"]

[tool.setuptools.package-data]
pygeofetch = ["config/*.yaml", "py.typed"]

[tool.black]
target-version = ["py39", "py310", "py311"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These test files intentionally do `x = pytest.importorskip("x")` before
# `from x.submodule import y`, so the optional dependency is skipped
# cleanly instead of erroring out collection when it's not installed
# (see tests/test_extraction.py for the original pattern this follows).
# That assignment is what triggers E402 on every import after it — it's
# the deliberate shape of the guard, not disorganized imports.
"tests/test_atmospheric_circular_regression.py" = ["E402"]
"tests/test_burst_processing_integration.py" = ["E402"]
"tests/test_gcp_reprojection.py" = ["E402"]
"tests/test_offset_tracking.py" = ["E402"]
"tests/test_raster_collocation_integration.py" = ["E402"]

[tool.mypy]
python_version        = "3.12"
ignore_missing_imports = true
exclude = '^(venv|\.venv|env|build|dist)/'
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["pygeofetch"]
branch = true
omit = [
    # Thin bindings that require SNAP / OpenSarToolkit to be installed on
    # the machine running the tests — not exercisable in a normal CI
    # container, so they're excluded rather than silently dragging the
    # percentage down for reasons unrelated to test quality.
    "pygeofetch/sar/_native.py",
    "pygeofetch/sar/_ost.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]
# 33.7% is the current measured baseline WITH branch coverage on
# (branch=true above is stricter than plain line coverage — a module can
# have every line executed but still miss branches, e.g. an `if` that
# only ever takes the True path in tests). 30% leaves a few points of
# slack so today's suite passes this gate. Ratchet this up deliberately
# as CLI/provider/processing coverage improves — treat drops below the
# last-merged value as a real regression, not just a number to reset.
fail_under = 30